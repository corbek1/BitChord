name: BitChord arm64 APK

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Restore signing key from cache
        id: keycache
        uses: actions/cache@v4
        with:
          path: bitchord-release.jks
          key: bitchord-keystore-v1

      - name: Create signing key (first run only)
        if: steps.keycache.outputs.cache-hit != 'true'
        run: |
          keytool -genkeypair -v -keystore bitchord-release.jks \
            -alias bitchord -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass bitchordpass -keypass bitchordpass \
            -dname "CN=BitChord"

      - name: Write local.properties and keystore.properties
        run: |
          {
            echo "LASTFM_API_KEY="
            echo "LASTFM_SECRET="
            echo "LISTEN_TOGETHER_SERVER="
          } > local.properties
          {
            echo "storeFile=bitchord-release.jks"
            echo "storePassword=bitchordpass"
            echo "keyAlias=bitchord"
            echo "keyPassword=bitchordpass"
          } > keystore.properties

      - name: Build signed prod release
        run: |
          chmod +x gradlew
          ./gradlew assembleProdRelease

      - name: Pick arm64-v8a APK
        run: |
          mkdir -p distribution
          ls -lh app/build/outputs/apk/prod/release/
          apk="$(find app/build/outputs/apk/prod/release -name '*arm64-v8a*.apk' | head -n 1)"
          test -s "$apk"
          cp "$apk" distribution/BitChord-arm64-v8a.apk
          ls -lh distribution

      - uses: actions/upload-artifact@v4
        with:
          name: BitChord-arm64-v8a
          path: distribution/BitChord-arm64-v8a.apk
          if-no-files-found: error
