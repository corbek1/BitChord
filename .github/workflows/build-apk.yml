name: BitChord arm64 APK

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Load signing key from secret
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > bitchord-release.jks
        
      - name: Check keystore
        run: |
          ls -l bitchord-release.jks
          keytool -list -keystore bitchord-release.jks -storepass bitchordpass
          
      - name: Write local.properties and keystore.properties
        run: |
          {
            echo "LASTFM_API_KEY="
            echo "LASTFM_SECRET="
            echo "LISTEN_TOGETHER_SERVER="
          } > local.properties
          {
            echo "storeFile=bitchord-release.jks"
            echo "storePassword=bitchordpass"
            echo "keyAlias=bitchord"
            echo "keyPassword=bitchordpass"
          } > keystore.properties

      - name: Build signed prod release
        run: |
          chmod +x gradlew
          ./gradlew assembleProdRelease

      - name: Pick arm64-v8a APK
        run: |
          mkdir -p distribution
          ls -lh app/build/outputs/apk/prod/release/
          apk="$(find app/build/outputs/apk/prod/release -name '*arm64-v8a*.apk' | head -n 1)"
          test -s "$apk"
          cp "$apk" distribution/BitChord-arm64-v8a.apk
          ls -lh distribution

      - uses: actions/upload-artifact@v4
        with:
          name: BitChord-arm64-v8a
          path: distribution/BitChord-arm64-v8a.apk
          if-no-files-found: error
